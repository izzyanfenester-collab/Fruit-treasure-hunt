name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sediakan video cerita
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p app/src/main/res/raw
          gdown "https://drive.google.com/uc?id=1PkR4yiBtC_nsbdrwAvjn-l62qVTDLgRv" -O app/src/main/res/raw/cerita.mp4
          python - <<'PY'
          import os
          p = "app/src/main/res/raw/cerita.mp4"
          size = os.path.getsize(p)
          print(f"Video cerita: {size/1024/1024:.1f} MB")
          assert size > 50_000_000, "Video cerita tidak berjaya dimuat turun dengan lengkap"
          PY

      - name: Sediakan signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 belum diset" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Uji aplikasi
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD belum diset" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS belum diset" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD belum diset" && exit 1)
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Treasure-Hunt-Buah-Buahan-v1.3-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
