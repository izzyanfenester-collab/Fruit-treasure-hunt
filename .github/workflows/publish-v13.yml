name: Publish Android v1.3 APK

on:
  push:
    paths:
      - ".github/workflows/publish-v13.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sediakan video cerita
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p app/src/main/res/raw
          gdown "https://drive.google.com/uc?id=1PkR4yiBtC_nsbdrwAvjn-l62qVTDLgRv" -O app/src/main/res/raw/cerita.mp4
          python - <<'PY'
          import os
          p = "app/src/main/res/raw/cerita.mp4"
          assert os.path.getsize(p) > 50_000_000
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Treasure-Hunt-Buah-Buahan-v1.3.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3-android >/dev/null 2>&1; then
            gh release upload v1.3-android Treasure-Hunt-Buah-Buahan-v1.3.apk --clobber
          else
            gh release create v1.3-android Treasure-Hunt-Buah-Buahan-v1.3.apk \
              --target "${GITHUB_SHA}" \
              --title "Treasure Hunt Buah-Buahan v1.3 Android" \
              --notes "Android v1.3 dengan menu Bahasa Melayu dan video CERITA offline."
          fi
