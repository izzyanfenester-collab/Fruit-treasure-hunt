name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sediakan video cerita
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p app/src/main/res/raw
          gdown "https://drive.google.com/uc?id=1PkR4yiBtC_nsbdrwAvjn-l62qVTDLgRv" -O app/src/main/res/raw/cerita.mp4
          python - <<'PY'
          import os
          p = "app/src/main/res/raw/cerita.mp4"
          size = os.path.getsize(p)
          print(f"Video cerita: {size/1024/1024:.1f} MB")
          assert size > 50_000_000, "Video cerita tidak berjaya dimuat turun dengan lengkap"
          PY

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test gameplay and Android scenes
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treasure-Hunt-Buah-Buahan-v1.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
